[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*


markers = 
    ui: Запускает все UI автотесты
    courses: Запускает тест на странице courses
    regression: Запускает тесты по регрессионому сценарию
    flaky: перезапуск упавшего теста, метод rerusn, reruns_delay



